name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "::error::sdkmanager 未找到，SDK 目录内容如下："; ls -la "$SDK" || true; exit 1
          fi
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          "$SDKM" --version
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName="1.0.${{ github.run_number }}" \
            -PappVersionCode=${{ github.run_number }}

      - name: 打包产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/gnsstoolkit-latest.apk
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/gnsstoolkit-latest.apk
            dist/SHA256SUMS.txt
          body: |
            ## 安装

            下载 `gnsstoolkit-latest.apk`，允许「安装未知来源应用」后直接安装。

            ```bash
            adb install -r gnsstoolkit-latest.apk
            ```

            要求 Android 8.0（API 26）及以上。

            > 使用 debug 证书签名，适合自签名安装与测试；上架请自行配置 keystore。

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ## 变更

            见下方自动生成的提交列表。
